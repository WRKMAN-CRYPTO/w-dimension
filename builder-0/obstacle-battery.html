<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>Builder-0.1 · Seed Battery</title>
<style>*{box-sizing:border-box}body{margin:0;background:#05070d;color:#eaf2ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}.title{font-size:13px;letter-spacing:.15em}.sub{font-size:10px;opacity:.6;margin:6px 0 14px}.panel{border:1px solid #ffffff1f;border-radius:14px;padding:12px;background:#080c15;margin-bottom:10px}button{width:100%;border:1px solid #ffffff2d;border-radius:13px;background:#0d1322;color:#fff;padding:13px;font:12px inherit}.big{font-size:18px;margin:4px 0 8px}.live{color:#f0b44d}.null{color:#8eb7ff}.muted{opacity:.6;font-size:10px}.bar{height:8px;background:#111827;border-radius:99px;overflow:hidden;margin:9px 0}.fill{height:100%;width:0;background:#f0b44d}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}.cell{border:1px solid #ffffff14;border-radius:10px;padding:8px;font-size:10px}.results{font-size:9px;line-height:1.55;max-height:38vh;overflow:auto;white-space:pre}.error{color:#ff7b72}</style></head><body>
<div class="title">BUILDER-0.1 / OBSTACLE BATTERY</div><div class="sub">frozen mechanics · centered curved walls · 100 paired seeds · 20,000 ticks each</div>
<div class="panel"><button id="go">RUN 100 SEEDS</button><div class="bar"><div class="fill" id="fill"></div></div><div class="muted" id="status">Ready. Same agents. They are not told walls exist.</div></div>
<div class="panel"><div class="row"><div class="cell"><span class="live">LIVE</span><div class="big" id="lw">0</div>wins</div><div class="cell">TIES<div class="big" id="ties">0</div>equal</div><div class="cell"><span class="null">NULL</span><div class="big" id="nw">0</div>wins</div></div></div>
<div class="panel"><div class="muted">MEAN Δ (LIVE − NULL)</div><div class="big" id="mean">—</div><div class="muted">MEDIAN Δ</div><div class="big" id="median">—</div></div>
<div class="panel"><div class="muted">SEED · LIVE · NULL · Δ · LIVE W SHIFTS</div><div class="results" id="results">No runs yet.</div></div>
<script>
window.addEventListener('error',e=>{document.getElementById('status').innerHTML='<span class="error">ERROR · '+(e.message||'unknown')+' · line '+(e.lineno||'?')+'</span>'});
const N=320,GRID_X=28,GRID_Y=14,TAU=Math.PI*2,TICKS=20000,COUNT=100;
let tick=0,currentSeed=0;\nfunction wallHit(x,y){\n  // Two mirrored curved wall segments. The center corridor is intentionally open.\n  if(y>0.455&&y<0.545)return false;\n  const arc=function(cx,cy,r){const dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);return Math.abs(dist-r)<0.012&&x>cx;};\n  return arc(0.39,0.50,0.205)||arc(0.57,0.50,0.205);\n}
function rngFactory(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let q=Math.imul(s^s>>>15,1|s);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296}}
function makeWorld(causal,seed){const R=rngFactory(seed),agents=[],field=new Float32Array(GRID_X*GRID_Y);for(let i=0;i<N;i++){const a=R()*TAU,r=R()*.12;agents.push({x:.16+Math.cos(a)*r,y:.5+Math.sin(a)*r,ang:R()*TAU,v:.0015+R()*.001,energy:0,w:R()*2-1})}return{causal,agents,field,delivered:0,transitions:0,lastBand:0,wMean:0}}
function fi(x,y){const gx=Math.max(0,Math.min(GRID_X-1,(x*GRID_X)|0)),gy=Math.max(0,Math.min(GRID_Y-1,(y*GRID_Y)|0));return gy*GRID_X+gx}
function step(world){const f=world.field;for(let i=0;i<f.length;i++)f[i]*=.994;let sumW=0;for(let i=0;i<world.agents.length;i++){const a=world.agents[i],local=f[fi(a.x,a.y)];const dxs=a.x-.10,dys=a.y-.5,dxk=a.x-.90,dyk=a.y-.5;const ds=dxs*dxs+dys*dys,dk=dxk*dxk+dyk*dyk;if(ds<.0064&&a.energy<1)a.energy=1;if(dk<.0064&&a.energy>.2){world.delivered+=a.energy;a.energy=0}const write=(a.energy>.2?.018:-.004)+Math.sin(a.ang+a.w*3)*.002;f[fi(a.x,a.y)]+=write;a.w=Math.tanh(a.w*.997+local*.018+(a.energy>.2?.006:-.002));const goal=a.energy>.2?0:Math.PI;const d=((goal-a.ang+Math.PI*3)%TAU)-Math.PI;const base=d*.0025+Math.sin(i*12.9898+tick*.011)*.004;const wTurn=world.causal?Math.tanh(local*2.2+a.w)*.028:0;a.ang+=base+wTurn;const ox=a.x,oy=a.y;a.x+=Math.cos(a.ang)*a.v;a.y+=Math.sin(a.ang)*a.v;if(wallHit(a.x,a.y)){a.x=ox;a.y=oy;a.ang=Math.PI-a.ang}if(a.x<.02||a.x>.98){a.ang=Math.PI-a.ang;a.x=Math.max(.02,Math.min(.98,a.x))}if(a.y<.08||a.y>.92){a.ang=-a.ang;a.y=Math.max(.08,Math.min(.92,a.y))}sumW+=a.w}world.wMean=sumW/N;const band=Math.max(0,Math.min(8,Math.floor((world.wMean+1)*4.5)));if(band!==world.lastBand){world.transitions++;world.lastBand=band}}
function median(a){const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
async function run(){const btn=document.getElementById('go');btn.disabled=true;let lw=0,nw=0,ties=0,rows=[],deltas=[];for(let n=0;n<COUNT;n++){currentSeed=(0xB017D00D+n*0x9E3779B9)>>>0;tick=0;const live=makeWorld(true,currentSeed),nul=makeWorld(false,currentSeed);for(tick=0;tick<TICKS;tick++){step(live);step(nul)}const d=live.delivered-nul.delivered;deltas.push(d);if(d>0)lw++;else if(d<0)nw++;else ties++;rows.push(currentSeed.toString(16).padStart(8,'0')+' · '+live.delivered.toFixed(0)+' · '+nul.delivered.toFixed(0)+' · '+(d>=0?'+':'')+d.toFixed(0)+' · '+live.transitions);document.getElementById('lw').textContent=lw;document.getElementById('nw').textContent=nw;document.getElementById('ties').textContent=ties;document.getElementById('fill').style.width=((n+1)/COUNT*100)+'%';document.getElementById('status').textContent='Running seed '+(n+1)+' / '+COUNT;document.getElementById('results').textContent=rows.slice(-12).reverse().join('\n');if(n%2===1)await new Promise(r=>setTimeout(r,0))}const mean=deltas.reduce((a,b)=>a+b,0)/deltas.length;document.getElementById('mean').textContent=(mean>=0?'+':'')+mean.toFixed(1);document.getElementById('median').textContent=(median(deltas)>=0?'+':'')+median(deltas).toFixed(1);document.getElementById('status').textContent='Complete · '+COUNT+' paired seeds · '+TICKS.toLocaleString()+' ticks each';btn.textContent='RUN AGAIN';btn.disabled=false}
document.getElementById('go').onclick=run;
</script></body></html>
