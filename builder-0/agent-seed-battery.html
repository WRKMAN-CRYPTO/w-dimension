<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>Builder-1.0 · Agent Seed Battery</title><style>
*{box-sizing:border-box}body{margin:0;background:#05070d;color:#eaf2ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:18px}.title{letter-spacing:.13em;font-size:17px}.sub{opacity:.6;font-size:11px;line-height:1.5;margin:7px 0 14px}button{background:#0b1020;color:#eaf2ff;border:1px solid #ffffff30;border-radius:12px;padding:11px 16px;font:12px inherit}.status{margin:14px 0;font-size:12px}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}.card{border:1px solid #ffffff18;border-radius:10px;padding:9px;background:#070b14}.k{opacity:.55;font-size:9px}.v{font-size:15px;margin-top:3px}.rows{font-size:9px;line-height:1.55;white-space:pre;overflow:auto;border-top:1px solid #ffffff18;padding-top:8px}.live{color:#f0b44d}.null{color:#8eb7ff}</style></head><body>
<div class="title">BUILDER-1.0 / AGENT SEED BATTERY</div><div class="sub">maze 4D415A45 fixed · mechanics frozen from 0.9<br>100 paired agent seeds · 400,000 ticks · sample every 1,000</div>
<button id="go">RUN BATTERY</button><div class="status" id="status">ready</div><div class="summary" id="summary"></div><div class="rows" id="rows"></div>
<script>
let tick=0,seed=0xB017D00D;const N=320,TAU=Math.PI*2,GX=28,GY=14;let live,nullw;
// Builder-0.9: seeded perfect maze. Walls are generated, not hand-authored.
const MAZE_SEED=0x4D415A45,MC=12,MR=9,MX=.18,MY=.08,MW=.72,MH=.84,WT=.008;
function mazeRng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let q=Math.imul(s^s>>>15,1|s);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296}}
function generateMaze(){
 const R=mazeRng(MAZE_SEED),n=MC*MR,seen=new Uint8Array(n),open=Array.from({length:n},()=>[0,0,0,0]),stack=[Math.floor(MR/2)*MC],dirs=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
 seen[stack[0]]=1;
 while(stack.length){const cur=stack[stack.length-1],x=cur%MC,y=(cur/MC)|0,c=[];
  for(const d of dirs){const nx=x+d[0],ny=y+d[1];if(nx>=0&&nx<MC&&ny>=0&&ny<MR&&!seen[ny*MC+nx])c.push(d)}
  if(!c.length){stack.pop();continue}
  const d=c[(R()*c.length)|0],nx=x+d[0],ny=y+d[1],ni=ny*MC+nx;open[cur][d[2]]=1;open[ni][d[3]]=1;seen[ni]=1;stack.push(ni)
 }
 return open
}
const MAZE=generateMaze(),WALLS=[];
function addWall(x,y,w,h){WALLS.push([x,y,w,h])}
(function buildWalls(){
 const cw=MW/MC,ch=MH/MR;
 // Outer frame, with entrance and exit openings at the middle row.
 addWall(MX,MY,MW,WT);addWall(MX,MY+MH-WT,MW,WT);
 const er=Math.floor(MR/2),ey=MY+er*ch;
 addWall(MX,MY,WT,er*ch);addWall(MX,ey+ch,WT,MY+MH-(ey+ch));
 addWall(MX+MW-WT,MY,WT,er*ch);addWall(MX+MW-WT,ey+ch,WT,MY+MH-(ey+ch));
 for(let y=0;y<MR;y++)for(let x=0;x<MC;x++){const i=y*MC+x,cx=MX+x*cw,cy=MY+y*ch;
  if(x<MC-1&&!MAZE[i][1])addWall(cx+cw-WT/2,cy,WT,ch);
  if(y<MR-1&&!MAZE[i][2])addWall(cx,cy+ch-WT/2,cw,WT);
 }
})();
function hitRect(x,y){for(const r of WALLS)if(x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3])return r;return null}
function collide(a,ox,oy){
 const r=hitRect(a.x,a.y);if(!r)return false;
 const wasX=ox<r[0]||ox>r[0]+r[2],wasY=oy<r[1]||oy>r[1]+r[3];a.x=ox;a.y=oy;
 if(wasX&&!wasY)a.ang=Math.PI-a.ang;else if(wasY&&!wasX)a.ang=-a.ang;else a.ang+=Math.PI;return true
}
function mazeRouteVerified(){
 const start=Math.floor(MR/2)*MC,target=Math.floor(MR/2)*MC+(MC-1),seen=new Uint8Array(MC*MR),q=[start];seen[start]=1;
 for(let h=0;h<q.length;h++){const i=q[h];if(i===target)return true;const x=i%MC,y=(i/MC)|0;
  const next=[[0,-1,0],[1,0,1],[0,1,2],[-1,0,3]];
  for(const d of next)if(MAZE[i][d[2]]){const nx=x+d[0],ny=y+d[1],ni=ny*MC+nx;if(!seen[ni]){seen[ni]=1;q.push(ni)}}
 }return false
}
function exteriorBypassExists(){
 // Flood physical free space, but forbid entering the maze interior. If source can reach sink,
 // an exterior highway exists around the maze frame.
 const nx=196,ny=168,seen=new Uint8Array(nx*ny),q=[[.10,.5]],dx=.96/(nx-1),dy=.84/(ny-1);
 const key=(x,y)=>{const ix=Math.max(0,Math.min(nx-1,Math.round((x-.02)/.96*(nx-1)))),iy=Math.max(0,Math.min(ny-1,Math.round((y-.08)/.84*(ny-1))));return iy*nx+ix};
 seen[key(.10,.5)]=1;
 for(let h=0;h<q.length;h++){const [x,y]=q[h];if((x-.90)*(x-.90)+(y-.5)*(y-.5)<.004)return true;
  for(const [sx,sy] of [[dx,0],[-dx,0],[0,dy],[0,-dy]]){const xx=x+sx,yy=y+sy;if(xx<.02||xx>.98||yy<.08||yy>.92||hitRect(xx,yy))continue;
   // Do not allow the bypass checker through the legal maze interior.
   if(xx>MX+WT&&xx<MX+MW-WT&&yy>MY+WT&&yy<MY+MH-WT)continue;
   const k=key(xx,yy);if(!seen[k]){seen[k]=1;q.push([xx,yy])}
  }
 }return false
}
function rngFactory(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let q=Math.imul(s^s>>>15,1|s);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296}}

function makeWorld(causal){const R=rngFactory(seed),agents=[],field=new Float32Array(GX*GY);for(let i=0;i<N;i++){const a=R()*TAU,r=R()*.12;agents.push({x:.16+Math.cos(a)*r,y:.5+Math.sin(a)*r,ang:R()*TAU,v:.0015+R()*.001,energy:0,w:R()*2-1,trail:[]})}return{causal,agents,field,delivered:0,pickups:0,hits:0,wMean:0,transitions:0,lastBand:0}}

function fi(x,y){const gx=Math.max(0,Math.min(GX-1,(x*GX)|0)),gy=Math.max(0,Math.min(GY-1,(y*GY)|0));return gy*GX+gx}
function enforceMazeBounds(a){
 if(a.y<MY+WT){a.y=MY+WT;a.ang=Math.abs(a.ang);return true}
 if(a.y>MY+MH-WT){a.y=MY+MH-WT;a.ang=-Math.abs(a.ang);return true}
 return false
}
function step(world){const f=world.field;for(let i=0;i<f.length;i++)f[i]*=.994;let sum=0;for(let i=0;i<N;i++){const a=world.agents[i],local=f[fi(a.x,a.y)],dxs=a.x-.10,dys=a.y-.5,dxk=a.x-.90,dyk=a.y-.5,ds=dxs*dxs+dys*dys,dk=dxk*dxk+dyk*dyk;if(ds<.0064&&a.energy<1){a.energy=1;world.pickups++}if(dk<.0064&&a.energy>.2){world.delivered+=a.energy;a.energy=0}f[fi(a.x,a.y)]+=(a.energy>.2?.018:-.004)+Math.sin(a.ang+a.w*3)*.002;a.w=Math.tanh(a.w*.997+local*.018+(a.energy>.2?.006:-.002));const goal=a.energy>.2?0:Math.PI,d=((goal-a.ang+Math.PI*3)%TAU)-Math.PI,base=d*.0025+Math.sin(i*12.9898+tick*.011)*.004,wTurn=world.causal?Math.tanh(local*2.2+a.w)*.028:0;a.ang+=base+wTurn;const ox=a.x,oy=a.y;a.x+=Math.cos(a.ang)*a.v;a.y+=Math.sin(a.ang)*a.v;if(collide(a,ox,oy))world.hits++;if(enforceMazeBounds(a))world.hits++;if(a.x<.02||a.x>.98){a.ang=Math.PI-a.ang;a.x=Math.max(.02,Math.min(.98,a.x))}a.trail.push([a.x,a.y]);if(a.trail.length>14)a.trail.shift();sum+=a.w}world.wMean=sum/N;const band=Math.max(0,Math.min(8,Math.floor((world.wMean+1)*4.5)));if(band!==world.lastBand){world.transitions++;world.lastBand=band}}
}draw();requestAnimationFrame(loop)}

const RUNS=100,END=400000,SAMPLE=1000,BASE=0xB017D00D;let running=false;
function make(seedValue,causal){seed=seedValue>>>0;return makeWorld(causal)}
function seedFor(i){let x=(BASE+i*0x9E3779B9)>>>0;x^=x>>>16;x=Math.imul(x,0x7feb352d);x^=x>>>15;x=Math.imul(x,0x846ca68b);x^=x>>>16;return x>>>0}
async function runOne(i){
 const sd=seedFor(i);tick=0;live=make(sd,true);nullw=make(sd,false);let minD=0,cross=null,prev=0;
 for(tick=1;tick<=END;tick++){step(live);step(nullw);if(tick%SAMPLE===0){const d=live.delivered-nullw.delivered;if(d<minD)minD=d;if(cross===null&&prev<=0&&d>0)cross=tick;prev=d}if(tick%20000===0)await new Promise(requestAnimationFrame)}
 return{seed:sd,l:live.delivered,n:nullw.delivered,d:live.delivered-nullw.delivered,min:minD,cross}
}
function render(rs){
 const crosses=rs.filter(r=>r.cross!==null),lw=rs.filter(r=>r.d>0).length,nw=rs.filter(r=>r.d<0).length,tie=rs.length-lw-nw,mean=rs.reduce((a,r)=>a+r.d,0)/rs.length;
 document.getElementById('summary').innerHTML='<div class="card"><div class="k">ENDPOINT L / N / T</div><div class="v">'+lw+' / '+nw+' / '+tie+'</div></div><div class="card"><div class="k">CROSSOVERS</div><div class="v">'+crosses.length+' / '+rs.length+'</div></div><div class="card"><div class="k">MEAN END Δ</div><div class="v">'+(mean>=0?'+':'')+mean.toFixed(1)+'</div></div><div class="card"><div class="k">MEDIAN CROSS</div><div class="v">'+(crosses.length?crosses.map(r=>r.cross).sort((a,b)=>a-b)[crosses.length>>1]+'t':'—')+'</div></div>';
 document.getElementById('rows').textContent='seed       LIVE NULL  endΔ  minΔ  cross\n'+rs.map(r=>r.seed.toString(16).padStart(8,'0')+'  '+String(r.l.toFixed(0)).padStart(4)+' '+String(r.n.toFixed(0)).padStart(4)+' '+String((r.d>=0?'+':'')+r.d.toFixed(0)).padStart(5)+' '+String(r.min.toFixed(0)).padStart(5)+' '+String(r.cross===null?'—':r.cross).padStart(7)).join('\n')
}
document.getElementById('go').onclick=async()=>{if(running)return;running=true;const rs=[];for(let i=0;i<RUNS;i++){document.getElementById('status').textContent='running '+(i+1)+' / '+RUNS+' · '+((i/RUNS)*100).toFixed(0)+'%';rs.push(await runOne(i));render(rs)}document.getElementById('status').textContent='complete · 100 paired seeds × 400,000 ticks';running=false};
</script></body></html>
