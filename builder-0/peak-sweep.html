<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070d"><title>Builder-0.5 · Orientation Sweep</title>
<style>*{box-sizing:border-box}body{margin:0;background:#05070d;color:#eaf2ff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom))}.title{font-size:13px;letter-spacing:.15em}.sub,.note{font-size:10px;opacity:.62;line-height:1.5}.panel{border:1px solid #ffffff1f;border-radius:14px;padding:12px;background:#080c15;margin:12px 0}button{width:100%;border:1px solid #ffffff2d;border-radius:13px;background:#0d1322;color:#fff;padding:13px;font:12px inherit}.bar{height:8px;background:#111827;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;width:0;background:#f0b44d}.grid{display:grid;grid-template-columns:48px 1fr 1fr 1fr 1fr;gap:4px;font-size:9px;align-items:center}.h{opacity:.55}.cell{padding:7px 3px;border-bottom:1px solid #ffffff0d;text-align:right}.ang{text-align:left;color:#f0b44d}.pos{color:#f0b44d}.neg{color:#8eb7ff}.error{color:#ff7b72}</style></head><body>
<div class="title">BUILDER-0.5 / PEAK SWEEP</div>
<div class="sub">5 orientations · 100 paired seeds each · 20,000 ticks · W frozen</div>
<div class="panel"><button id="go">RUN ORIENTATION SWEEP</button><div class="bar"><div class="fill" id="fill"></div></div><div class="note" id="status">Ready. Arc orientation is the only swept variable.</div></div>
<div class="panel"><div class="grid"><div class="cell h">ANGLE</div><div class="cell h">L/N/T</div><div class="cell h">MEAN Δ</div><div class="cell h">MEDIAN</div><div class="cell h">DONE</div><div id="rows" style="display:contents"></div></div></div>
<div class="note">Focused scan of the apparent high-performance region from Builder-0.5. The central y corridor remains unchanged.</div>
<script>
window.addEventListener('error',e=>{const s=document.getElementById('status');s.textContent='ERROR · '+(e.message||'unknown')+' · line '+(e.lineno||'?');s.className='error'});
const N=320,GX=28,GY=14,TAU=Math.PI*2,TICKS=20000,COUNT=100,ANGLES=[0,15,30,45,60];
let tick=0,wallAngle=0;
function rngFactory(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let q=Math.imul(s^s>>>15,1|s);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296}}
function wallHit(x,y){if(y>0.455&&y<0.545)return false;const ux=Math.cos(wallAngle),uy=Math.sin(wallAngle);function arc(cx,cy){const dx=x-cx,dy=y-cy,dist=Math.sqrt(dx*dx+dy*dy);if(Math.abs(dist-.205)>=.012)return false;return dx*ux+dy*uy>0}return arc(.39,.50)||arc(.57,.50)}
function makeWorld(causal,seed){const R=rngFactory(seed),agents=[],field=new Float32Array(GX*GY);for(let i=0;i<N;i++){const a=R()*TAU,r=R()*.12;agents.push({x:.16+Math.cos(a)*r,y:.5+Math.sin(a)*r,ang:R()*TAU,v:.0015+R()*.001,energy:0,w:R()*2-1})}return{causal,agents,field,delivered:0}}
function fi(x,y){const gx=Math.max(0,Math.min(GX-1,(x*GX)|0)),gy=Math.max(0,Math.min(GY-1,(y*GY)|0));return gy*GX+gx}
function step(world){const f=world.field;for(let i=0;i<f.length;i++)f[i]*=.994;for(let i=0;i<world.agents.length;i++){const a=world.agents[i],local=f[fi(a.x,a.y)];const dxs=a.x-.10,dys=a.y-.5,dxk=a.x-.90,dyk=a.y-.5;const ds=dxs*dxs+dys*dys,dk=dxk*dxk+dyk*dyk;if(ds<.0064&&a.energy<1)a.energy=1;if(dk<.0064&&a.energy>.2){world.delivered+=a.energy;a.energy=0}const write=(a.energy>.2?.018:-.004)+Math.sin(a.ang+a.w*3)*.002;f[fi(a.x,a.y)]+=write;a.w=Math.tanh(a.w*.997+local*.018+(a.energy>.2?.006:-.002));const goal=a.energy>.2?0:Math.PI,d=((goal-a.ang+Math.PI*3)%TAU)-Math.PI,base=d*.0025+Math.sin(i*12.9898+tick*.011)*.004,wTurn=world.causal?Math.tanh(local*2.2+a.w)*.028:0;a.ang+=base+wTurn;const ox=a.x,oy=a.y;a.x+=Math.cos(a.ang)*a.v;a.y+=Math.sin(a.ang)*a.v;if(wallHit(a.x,a.y)){a.x=ox;a.y=oy;a.ang=Math.PI-a.ang}if(a.x<.02||a.x>.98){a.ang=Math.PI-a.ang;a.x=Math.max(.02,Math.min(.98,a.x))}if(a.y<.08||a.y>.92){a.ang=-a.ang;a.y=Math.max(.08,Math.min(.92,a.y))}}}
function median(a){const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2}
function row(angle){const box=document.createElement('div');box.style.display='contents';box.innerHTML='<div class="cell ang">'+angle+'°</div><div class="cell" id="w'+angle+'">—</div><div class="cell" id="m'+angle+'">—</div><div class="cell" id="d'+angle+'">—</div><div class="cell" id="c'+angle+'">0%</div>';document.getElementById('rows').appendChild(box)}ANGLES.forEach(row);
async function run(){const btn=document.getElementById('go');btn.disabled=true;let completed=0;for(const deg of ANGLES){wallAngle=deg*Math.PI/180;let lw=0,nw=0,ties=0,deltas=[];for(let n=0;n<COUNT;n++){const seed=(0xB017D00D+n*0x9E3779B9)>>>0;tick=0;const live=makeWorld(true,seed),nul=makeWorld(false,seed);for(tick=0;tick<TICKS;tick++){step(live);step(nul)}const d=live.delivered-nul.delivered;deltas.push(d);if(d>0)lw++;else if(d<0)nw++;else ties++;document.getElementById('c'+deg).textContent=(n+1)+'%';document.getElementById('status').textContent='Angle '+deg+'° · seed '+(n+1)+' / '+COUNT;if(n%2===1)await new Promise(r=>setTimeout(r,0))}const mean=deltas.reduce((a,b)=>a+b,0)/COUNT,med=median(deltas);document.getElementById('w'+deg).textContent=lw+'/'+nw+'/'+ties;const me=document.getElementById('m'+deg),de=document.getElementById('d'+deg);me.textContent=(mean>=0?'+':'')+mean.toFixed(1);de.textContent=(med>=0?'+':'')+med.toFixed(1);me.className='cell '+(mean>=0?'pos':'neg');de.className='cell '+(med>=0?'pos':'neg');completed++;document.getElementById('fill').style.width=(completed/ANGLES.length*100)+'%'}document.getElementById('status').textContent='Complete · 500 paired runs';btn.textContent='RUN AGAIN';btn.disabled=false}
document.getElementById('go').onclick=run;
</script></body></html>
